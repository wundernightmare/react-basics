# pnpm 11 no longer reads the `pnpm` field in package.json — settings live here.
# It also turns an ignored build script into a hard install failure, so every
# postinstall we actually want has to be approved explicitly: esbuild fetches a
# platform binary and lefthook installs the git hook runner (hooks themselves
# stay opt-in — see lefthook.yml). msw 3 dropped its postinstall, so it needs no
# entry (see README for regenerating the worker).
allowBuilds:
  esbuild: true
  lefthook: true

# Stryker still imports the legacy TypeScript compiler API removed in TS7.
packageExtensions:
  '@stryker-mutator/core':
    dependencies:
      typescript: 6.0.3

# Transitive CVEs pinned out, as caret floors (`pnpm update` still moves them
# inside the major). Drop an entry once `pnpm why <name>` shows the dependents
# already require the floor.
overrides:
  source-map-js: ^1.2.2 # GHSA-68fv-2mgg-jv7q via vite/postcss
  fast-uri: ^3.1.9      # GHSA-w74x / wjr9 / 333x / xhq7 via ajv → @hookform/resolvers
  qs: ^6.16.0           # GHSA-4mjr / x5fp / q8mj via @stryker-mutator → typed-rest-client
  minimatch: ^11.0.1    # GHSA-g3hv-75wg-m249 via @stryker-mutator; test:mutation covers the major override
