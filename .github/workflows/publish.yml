name: publish

# Optional artifact publishing to S3. Runs on a version tag or manual dispatch,
# and ONLY when the repo has an `S3_BUCKET` variable configured (Settings →
# Secrets and variables → Actions → Variables). Without it the job is skipped,
# so the template is inert until you opt in.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      update_latest:
        description: "Mirror this build to <prefix>/latest/"
        type: boolean
        default: true

permissions:
  id-token: write # OIDC: assume the AWS role without long-lived keys
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: vars.S3_BUCKET != ''
    env:
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_PREFIX: ${{ vars.S3_PREFIX || 'builds' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      UPDATE_LATEST: ${{ github.event.inputs.update_latest || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BUILD_ID: ${{ github.ref_name }}-${{ github.sha }}
          GIT_COMMIT: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: ./scripts/s3-publish.sh
